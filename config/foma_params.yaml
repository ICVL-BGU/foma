# Single source of truth for FOMA parameters.
# - Top-level scalar/list keys mirror constants exposed by src/etc/settings.py
# - Per-node sections (e.g. video_writer_room) load into that node's private namespace
#   when this file is loaded with <rosparam command="load" .../> at global scope.

# ---------- Hardware ports ----------
LIDAR_PORT: /dev/lidar
LIDAR_PORT_SPEED: 256000
LIDAR_OFFSET: 90

DIMMER_PORT: /dev/light_dimmer
DIMMER_PORT_SPEED: 115200

MOTOR_PORT: /dev/ttyAMA0
MOTOR_SPEED: 127
MOTOR_RIGHT_LEFT_RESET: 23
MOTOR_TOP_BOTTOM_RESET: 24
MOTOR_TOP_CHA: 5
MOTOR_TOP_CHB: 6
MOTOR_BOTTOM_CHA: 13
MOTOR_BOTTOM_CHB: 19
MOTOR_RIGHT_CHA: 12
MOTOR_RIGHT_CHB: 16
MOTOR_LEFT_CHA: 20
MOTOR_LEFT_CHB: 21

SAFETY_DISTANCE: 400        # mm
DIRECTION_EPSILON: 45

FEEDER_DIR_PIN: 18
FEEDER_STEP_PIN: 27
FEEDER_ENABLE_PIN: 4
FEEDER_PWM_PIN: 17
FEEDER_STEPS_PER_REVOLUTION: 200
FEEDER_MICROSTEPS: 4
FEEDER_RPM: 15
FEEDER_HOLE_OFFSET_ANGLE_DIVISOR: 32   # FEEDER_HOLE_OFFSET_ANGLE = 360 / divisor

# ---------- Camera / map shapes & FPS ----------
ROOM_CAMERA_FPS: 25
ROOM_MAP_FPS: 25
FOMA_CAMERA_FPS: 20
ROOM_CAMERA_FRAME_SHAPE:  &room_camera_shape [1280, 1280]    # published/received (resized from native); GUI + localization use this
ROOM_RTSP_URL: "rtsp://admin:icvl2023@1.1.2.103:554"          # ceiling camera; used by ceiling_camera + room_recorder
ROOM_CAMERA_NATIVE_SHAPE: [2560, 2560]    # native sensor resolution
ROOM_FLOOR_MAP_SHAPE:     [5000, 5000]
ROOM_MAP_FRAME_SHAPE:     &room_map_shape    [1000, 1000]
FOMA_CAMERA_FRAME_SHAPE:  &foma_camera_shape  [640, 640]

# ---------- Heading (shared by go_home_node and motor_control_node) ----------
# Heading = wall direction seen by the lidar, folded to [-45, 45); 0 = square.
ALIGN_SIGN: 1               # angular.z sign that reduces a positive heading error
HEADING_OFFSET_DEG: 3.6     # lidar mounting yaw vs the chassis (measured 2026-11-15: +3.61 +-0.02). To measure:
                            # square the robot by hand, read "heading err" in
                            # the GoHome window, enter that value here.

# ---------- Go To (shared by go_home_node and gui_node) ----------
# Points are normalised floor coordinates, as localization/location.world.
GOTO_TARGETS:
  door: [0.0, 0.0]          # placeholder: read the real value at the door from localization/location
GOTO_ROOM_BOUNDS_MM: [0, 5000, 0, 5000]   # walls in floor-map mm (x_min, x_max, y_min, y_max). Placeholder: measure
GOTO_ROBOT_SIZE_M: 1.0      # footprint side. The robot centre keeps half of it
GOTO_WALL_MARGIN_M: 0.2     # ... plus this from every wall
GOTO_WORLD_DET: -1          # room frame handedness seen from the body, found on the robot 2026-11-22. 0 = unknown (go_to probes twice and logs the value)
GOTO_ROOM_CENTER: []        # room centre in camera coordinates, from the GoHome log line "GOTO_ROOM_CENTER: [x, y]". Empty = anchor on camera frames at each go_to

# ---------- Motor control: heading hold while translating ----------
motor_control_node:
  heading_hold:
    enabled: true           # runtime: rosservice call /motor_control/heading_hold
    # Heading from a line fit per wall (~0.1 deg precise), so the hold can act
    # on tenths of a degree before they become a visible diagonal.
    kp: 0.060               # duty per degree
    ki: 0.030               # duty per degree-second: cancels a wheel that slips steadily
    max_corr: 0.30          # cap on the rotation mixed into a drive
    deadband_deg: 0.1
    filter_alpha: 0.5       # heading smoothing (1 = none); the fit is precise enough for light smoothing
    min_conf: 0.5           # inlier fraction of wall segments to trust heading
    runaway_deg: 6.0        # error growing this far while correcting -> hold pauses until the next stop
    max_trips: 3            # ... and after this many pauses disables itself
  # Lane hold: a straight drive in any direction (axis or explicit diagonal,
  # joystick or fish) stays on the line it started on. Corrects the sideways
  # slip that the heading hold cannot see.
  lane_hold:
    enabled: true
    kp: 3.0                 # duty per metre of drift across the line
    max_corr: 0.35
    # The correction drives the wheels the straight drive leaves idle; they
    # stand still, so below static friction (~0.2) they do not move at all.
    min_corr: 0.24          # 0.18 only stopped the drift (held at 2.5 cm); raise if it still builds up, lower if it zig-zags
    deadband_m: 0.010       # drift smaller than this is left alone
    jump_m: 0.25            # sudden change bigger than this = obstacle, new line
    dir_tol_deg: 5.0        # command direction change that starts a new line
  axis_snap_deg: 12.0       # joystick only: within this of an axis drives exactly along it
  # Precise in-place rotation (LIDAR scan matching), service rotate/quarter_turns
  rotate:
    # --- request limits ---
    max_quarter_turns: 8         # +/-720 deg; larger is rejected
    snap_to_quarter: true        # round to the nearest 0.25 turn
    # --- geometry / safety ---
    # motor_control skips its lidar check while rotating, so this is the only
    # protection. The full circle is swept: no direction can be relaxed.
    robot_radius_mm: 407         # 576 mm square -> circumscribed radius
    clearance_margin_mm: 80      # pre-flight margin
    run_margin_mm: 30            # in-turn margin (a moving scan is noisy)
    max_violating_bins: 2        # tolerate spurious returns
    run_violation_cycles: 3      # consecutive violations before aborting
    min_valid_bins: 200
    require_clearance: true      # off for bench work
    # --- lidar model ---
    # lidar_node keeps republishing a stale buffer after the sensor dies, so
    # liveness is judged from the contents changing.
    lidar_rev_s: 0.18            # fallback; measured at reference capture
    measure_rev_period: false    # probe times out when stationary; use lidar_rev_s
    scan_timeout_s: 0.5          # no message at all -> abort
    liveness_window_s: 0.7       # contents must change while moving
    min_changed_bins: 10
    # --- scan matching ---
    window_deg: 25.0             # MUST stay < 45: rooms alias every 90 deg,
                                 # which is exactly what we turn
    reject_deg: 15.0
    clip_mm: 300.0               # truncated L1: no stale bin can move the minimum
    min_overlap: 100
    cost_max_mm: 400.0
    max_bad_measurements: 15
    refine_step_deg: 0.2
    rate_alpha: 0.25
    # --- motion ---
    control_hz: 50.0
    match_hz: 25.0
    max_ang_v: 0.55              # brake scales with measured rate, so it adapts
    min_ang_v: 0.20              # below this the drive train stalls
    kp_duty_per_deg: 0.03        # saturates beyond 18 deg (0.015: 37 deg, a slow 14 s tail on 90)
    stop_lead_s: 0.25            # predictive brake, scaled by measured rate (raised with kp)
    stop_lead_deg: 1.0
    runaway_deg: 20.0            # error growing this far past best -> abort
    # --- sign conventions ---
    # Both depend on wiring and are not provable from source, hence the
    # autodetect. Record the value here if it ever flips.
    angle_sign: 1                # +1: a positive request turns CCW
    rotate_sign: -1              # angular.z sign that increases the shift
    sign_autodetect: true
    sign_probe_deg: 4.0          # too small to reach a 90 deg alias
    sign_probe_s: 2.0
    # --- finish ---
    settle_s: 0.8                # ramp-down + >= 2 lidar revolutions
    trim_settle_s: 0.4           # same after a trim: low duty ramps down in ~0.2 s
    still_tol_deg: 0.4
    tol_deg: 2.5                 # actuation floor: shortest pulse is ~3 deg
    trim_min_deg: 1.5            # below this a trim would oscillate
    max_trims: 2
    # Square to the room at the end: quarter turns finish on the wall heading,
    # so a crooked start or a short turn still ends aligned.
    snap_to_axes: true
    snap_tol_deg: 1.5            # trims under ~1.5 deg did not move the robot, only cost time
    max_snap_deg: 20.0           # squaring up farther than this from the request logs a warning
    max_snap_trims: 5            # trims allowed when finishing on the walls (relative finish: max_trims)
    # Stall recovery: commanded but not turning for stall_s -> floor + stall_step.
    # min_ang_v alone did not break static friction on this floor.
    stall_s: 0.4
    stall_dps: 1.5
    stall_step: 0.04
    max_trim_deg: 12.0
    trim_timeout_s: 6.0
    # --- budget ---
    base_timeout_s: 4.0
    min_expected_rate_dps: 15.0  # deliberately pessimistic
    max_timeout_s: 120.0
    stop_publish_s: 0.4          # zeros for this long, then silence so
                                 # motor_control's watchdog is a 2nd backstop
    publish_progress: true

# ---------- Go Home (LIDAR room-centring) ----------
go_home_node:
  # linear.{x,y} are motor duty in [-1, 1], not m/s.
  max_lin_v: 0.95
  min_lin_v: 0.25   # below this the drive train stalls
  kp_lin: 8.0       # control goes flat below min_lin_v/kp_lin = 3.1 cm
  # Heading is the wall direction in degrees, folded to [-45, 45).
  max_ang_v: 0.45
  min_ang_v: 0.20
  kp_ang: 0.015       # duty per degree, saturates beyond 30 deg
  # Must stay above min_lin_v/kp_lin (0.031 m) or the loop cannot settle.
  # Relax center_tol first if the robot hunts until timeout.
  center_tol: 0.045
  verify_center_tol: 0.065
  align_tol: 2.5        # deg. rotate_node measured ~3 deg as the shortest turn
  verify_align_tol: 2.0   # fine_align_tol < this < align_tol
  release_scale: 1.5    # settling tolerates residual up to tol * this
  center_drift_deg: 6.0 # heading lost while centring -> re-align
  min_heading_conf: 0.5 # inlier fraction of wall segments to trust heading
  sign_autodetect: false  # ALIGN_SIGN=1 confirmed on the robot; true = check during the first turn
  # Smooth turn: min_ang_v breaks away, creep_ang_v once turning, coast when
  # the measured rate would reach the target within stop_lead_s.
  creep_ang_v: 0.17     # raise if the turn stalls short of the target
  stop_lead_s: 0.25     # raise if it overshoots, lower if it stops short
  fine_align_tol: 1.0   # deg; final in-place squaring after centring
  # Settling time before a phase completes. Seconds, not frames.
  align_settle: 0.8
  center_settle: 0.8
  timeout: 90.0       # whole routine, shared across both phases
  control_hz: 100.0
  go_home_passes: 3   # align+centre retries before giving up
  # go_to: the camera anchors the LIDAR wall distances once at the start, then the LIDAR alone drives and verifies.
  goto_tol: 0.035       # m. Keep above min_lin_v/goto_kp (0.031) or it cannot settle
  verify_goto_tol: 0.07
  goto_settle: 0.8      # s
  goto_kp: 8.0          # duty per metre, on LIDAR + camera (as kp_lin)
  goto_max_v: 0.95      # lower if it overshoots the target
  goto_cam_kp: 2.0      # camera alone (a wall out of sight): its lag needs a slow approach
  goto_cam_max_v: 0.5
  goto_brake_m: 0.30    # closer than this: at most goto_approach_v. Raise both if it still overshoots
  goto_approach_v: 0.45
  goto_diag_m: 0.15     # per-axis friction floor (a true diagonal) only further than this
  goto_lidar_clamp: true  # also keep the target inside the walls the LIDAR sees. false in a maze
  probe_v: 0.35         # duty of the short move that finds the room axes
  # Walls: back off before turning in place (the corners need half the diagonal),
  # and back off and retry a drive that stops making progress.
  escape_clear_m: 0.46  # LIDAR returns closer than this -> back off first
  escape_v: 0.45
  stuck_s: 2.0          # no progress this long while driving -> back off and retry
  # Live top-down window: room model + LIDAR returns.
  visualize: true
  viz_fps: 20
  viz_size: 720
  viz_range_m: 0.0   # 0 = auto-fit to the scan


# ---------- Writer node params (loaded into node-private namespace) ----------
csv_writer_foma_location:
  topic: localization/location
  msg_type: FomaLocation
  filename: foma_location.csv
  data_type: foma_location
  fields: [time, x_w, y_w, x_i, y_i]

csv_writer_fish_location:
  topic: fish_detection/state
  msg_type: TwistStamped
  filename: fish_location.csv
  data_type: fish_state
  fields: [time, x, y, angle]

csv_writer_foma_speed:
  topic: motor_control/speed
  msg_type: TwistStamped
  filename: foma_speed.csv
  data_type: foma_speed
  fields: [time, v, h, r]

csv_writer_lidar:
  topic: lidar/scans
  msg_type: LaserScan
  filename: lidar_scans.csv
  data_type: lidar
  fields: [time]

room_recorder:
  filename: room_video.mp4
  # Pulls RTSP stream directly, demuxes H.264, writes mp4 with no decode/encode.
  # Reads ROOM_RTSP_URL from global params; no per-node URL needed.

video_writer_foma:
  topic: fish_camera/image
  msg_type: CompressedImage
  filename: foma_video.mp4
  fourcc: X264
  fps: 20
  frame_shape: *foma_camera_shape
  video_type: standard
  enable_reframe_worker: false

event_writer:
  topic: trial_events
  filename: trial_events.csv
  fields: [timestamp, event_type, details]

video_writer_room_map:
  topic: localization/location
  msg_type: FomaLocation
  filename: room_map.mp4
  fourcc: X264
  fps: 25
  frame_shape: *room_map_shape
  video_type: trajectory_map
  enable_reframe_worker: true
  reframe_worker_script: etc/reframe_worker.py
  reframe_force: false
  reframe_no_ffmpeg: false
