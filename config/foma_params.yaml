# Single source of truth for FOMA parameters.
# - Top-level scalar/list keys mirror constants exposed by src/etc/settings.py
# - Per-node sections (e.g. video_writer_room) load into that node's private namespace
#   when this file is loaded with <rosparam command="load" .../> at global scope.

# ---------- Hardware ports ----------
LIDAR_PORT: /dev/lidar
LIDAR_PORT_SPEED: 256000
LIDAR_OFFSET: 90

DIMMER_PORT: /dev/light_dimmer
DIMMER_PORT_SPEED: 115200

MOTOR_PORT: /dev/ttyAMA0
MOTOR_SPEED: 127
MOTOR_RIGHT_LEFT_RESET: 23
MOTOR_TOP_BOTTOM_RESET: 24
MOTOR_TOP_CHA: 5
MOTOR_TOP_CHB: 6
MOTOR_BOTTOM_CHA: 13
MOTOR_BOTTOM_CHB: 19
MOTOR_RIGHT_CHA: 12
MOTOR_RIGHT_CHB: 16
MOTOR_LEFT_CHA: 20
MOTOR_LEFT_CHB: 21

SAFETY_DISTANCE: 400        # mm
DIRECTION_EPSILON: 45

FEEDER_DIR_PIN: 18
FEEDER_STEP_PIN: 27
FEEDER_ENABLE_PIN: 4
FEEDER_PWM_PIN: 17
FEEDER_STEPS_PER_REVOLUTION: 200
FEEDER_MICROSTEPS: 4
FEEDER_RPM: 15
FEEDER_HOLE_OFFSET_ANGLE_DIVISOR: 32   # FEEDER_HOLE_OFFSET_ANGLE = 360 / divisor

# ---------- Camera / map shapes & FPS ----------
ROOM_CAMERA_FPS: 25
ROOM_MAP_FPS: 25
FOMA_CAMERA_FPS: 20
ROOM_CAMERA_FRAME_SHAPE:  &room_camera_shape [1280, 1280]    # published/received (resized from native); GUI + localization use this
ROOM_RTSP_URL: "rtsp://admin:icvl2023@1.1.2.103:554"          # ceiling camera; used by ceiling_camera + room_recorder
ROOM_CAMERA_NATIVE_SHAPE: [2560, 2560]    # native sensor resolution
ROOM_FLOOR_MAP_SHAPE:     [5000, 5000]
ROOM_MAP_FRAME_SHAPE:     &room_map_shape    [1000, 1000]
FOMA_CAMERA_FRAME_SHAPE:  &foma_camera_shape  [640, 640]

# ---------- Writer node params (loaded into node-private namespace) ----------
csv_writer_foma_location:
  topic: localization/location
  msg_type: FomaLocation
  filename: foma_location.csv
  data_type: foma_location
  fields: [time, x_w, y_w, x_i, y_i]

csv_writer_fish_location:
  topic: fish_detection/state
  msg_type: TwistStamped
  filename: fish_location.csv
  data_type: fish_state
  fields: [time, x, y, angle]

csv_writer_foma_speed:
  topic: motor_control/speed
  msg_type: TwistStamped
  filename: foma_speed.csv
  data_type: foma_speed
  fields: [time, v, h, r]

csv_writer_lidar:
  topic: lidar/scans
  msg_type: LaserScan
  filename: lidar_scans.csv
  data_type: lidar
  fields: [time]

room_recorder:
  filename: room_video.mp4
  # Pulls RTSP stream directly, demuxes H.264, writes mp4 with no decode/encode.
  # Reads ROOM_RTSP_URL from global params; no per-node URL needed.

video_writer_foma:
  topic: fish_camera/image
  msg_type: CompressedImage
  filename: foma_video.mp4
  fourcc: X264
  fps: 20
  frame_shape: *foma_camera_shape
  video_type: standard
  enable_reframe_worker: false

event_writer:
  topic: trial_events
  filename: trial_events.csv
  fields: [timestamp, event_type, details]

video_writer_room_map:
  topic: localization/location
  msg_type: FomaLocation
  filename: room_map.mp4
  fourcc: X264
  fps: 25
  frame_shape: *room_map_shape
  video_type: trajectory_map
  enable_reframe_worker: true
  reframe_worker_script: etc/reframe_worker.py
  reframe_force: false
  reframe_no_ffmpeg: false
